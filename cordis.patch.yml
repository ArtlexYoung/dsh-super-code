# Harness 0.1.7 declares presets through bundle rows. Earlier hosts retain a
# directory roster; the host plugin copies the bundled preset into its user root.
- insert:
    - id: preset-super-code
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        id: super-code
        name: Super Code
        description: A faster, more efficient, smarter coding mode.
        order: 5
        plugins:
          - id: super-code
            name: dsh-super-code/super-code
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              searchTimeoutMs: 60000
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: continuable
              maxDepth: 1
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

# Register host projections and discover the browser contribution.
- insert:
    - id: super-code
      name: dsh-super-code
