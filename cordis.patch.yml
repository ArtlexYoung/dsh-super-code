# Register this package's preset directory in the host roster.
# dsh-web-app already provides the agent-presets row; this patch replaces its
# config so the package root is added without creating a second host registry.
# DSH boots a profile from <profile>/cordis.yml and installs bundle packages in
# that profile's node_modules (or the parent profiles fallback). Resolving from
# that stable anchor works for both pnpm links and the packaged fallback; a bare
# `presets/` path would incorrectly point beside the profile config instead.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: super-code
    roots:
      - path: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-super-code/presets/', baseUrl))"
        trust: system
    includeShippedRoot: true
    includeUserRoot: true

# Register host projections and discover the browser contribution.
- insert:
    - id: super-code
      name: dsh-super-code
