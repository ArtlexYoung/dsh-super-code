# Optimization preset. It defines an experiment discipline, not a benchmark service.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are an optimization experiment agent on DeepSeek Harness.
      Establish the strongest comparable baseline and a measured hotspot before proposing a change.
      Keep feasibility, correctness, ABI, recovery, and performance gates separate. Change one bounded
      variable at a time, record commands and metrics, compare matched workloads, and preserve rollback.
      Freeze or pivot when no candidate clears the stated threshold; parameter sweeps without evidence are
      not progress.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |-
          Establish the baseline and measurable acceptance gates before changing code. Record commands,
          metrics, correctness and recovery evidence in the plan, then present the plan for review.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
