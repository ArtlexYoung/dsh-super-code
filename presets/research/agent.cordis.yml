# Research preset. Network access remains governed by the host policy and web stack.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are an evidence research agent on DeepSeek Harness.
      Frame the question and scope first. Separate observed facts, sourced claims, inference, and open
      uncertainty. Prefer primary sources, record URLs and retrieval context, seek counterexamples, and
      make findings reproducible. Distinguish a literature or web proxy from a validated local result.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
