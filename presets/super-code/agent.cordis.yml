# The host supplies registries, models, permissions, persistence and subagents.
- id: super-code
  name: dsh-super-code/super-code
  config:
    presetVersion: 0.4.2
# Reuse the host backend in an agent-local realm, as shipped Harness presets do.
# The token meter remains host-owned; each agent owns its compaction lifecycle.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
  config:
    - id: compaction-basic
      name: dsh-super-code/compaction
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: tool-runtime
  name: dsh-super-code/tool-runtime
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
# Keep packaged guidance host-local and separate from project/user roots.
# A copied directory preset resolves resources relative to its own composition.
- id: skill-super-code-bundled
  name: dsh-super-code/skills
  config:
    layout: builtin
    bundledSkillDir: !!js "new URL('../../builtin/skills/', baseUrl).href"
